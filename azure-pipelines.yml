# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.9'
    addToPath: true

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install dependencies'

- task: Docker@2
  inputs:
    containerRegistry: 'docker hub connection/3122022'
    repository: '3122022/azure sample-app'
    command: 'buildAndPush'
    Dockerfile: '**/Dockerfile'
    tags: 'latest'

- task: Kubernetes@1
  inputs:
    connectionType: 'k3s-rancher-ubuntu-preview'
    kubernetesServiceEndpoint: 'https://127.0.0.1:6443'
    namespace: 'default'
    command: 'apply'
    arguments: '-f k8s/deployment.yaml'

