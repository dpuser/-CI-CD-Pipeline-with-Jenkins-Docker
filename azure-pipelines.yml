# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UseNode@0
  inputs:
    versionSpec: '14.x'
- script: npm install
  displayName: 'Install dependencies'
- script: npm test
  displayName: 'Run tests'
- script: npm run build
  displayName: 'Build project'
- task: Docker@2
  inputs:
    containerRegistry: 'dockerhub'
    repository: 'your-docker-hub-username/your-repo'
    command: 'build'
    Dockerfile: '**/Dockerfile'
- task: Kubernetes@1
  inputs:
    connectionType: 'KubernetesServiceConnection'
    kubernetesServiceEndpoint: 'your-kubernetes-service-endpoint'
    namespace: 'default'
    command: 'apply'
    arguments: '-f your-kubernetes-manifest.yaml'
