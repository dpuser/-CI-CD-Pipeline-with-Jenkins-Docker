# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

pool:
  name: default
  demands:
    - Agent.OS -equals Linux

steps:
- script: |
    apt-get update -y
    apt-get install -y wget build-essential zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev
  displayName: 'Install dependencies for building Python'

- script: |
    wget https://www.python.org/ftp/python/3.9.7/Python-3.9.7.tgz
    tar -xf Python-3.9.7.tgz
    cd Python-3.9.7
    ./configure --enable-optimizations
    make -j 4
    make altinstall
  displayName: 'Build and install Python 3.9.7'

- script: |
    python3.9 -m pip install --upgrade pip
    pip3.9 install -r app/requirements.txt
  displayName: 'Install dependencies'

- task: Docker@2
  inputs:
    containerRegistry: 'docker hub connection/3122022'
    repository: '3122022/azure-sample-app1'
    command: 'buildAndPush'
    Dockerfile: '**/Dockerfile'
    tags: 'latest'

- script: |
    mkdir -p ~/.kube
    echo "$(KUBECONFIG_CONTENT)" | base64 --decode > ~/.kube/config
  displayName: 'Set up kubeconfig'
  env:
    KUBECONFIG_CONTENT: $(KUBECONFIG_CONTENT)

- script: kubectl apply -f k8s/deployment.yaml
  displayName: 'Deploy to Kubernetes'
  env:
    KUBECONFIG_CONTENT: $(KUBECONFIG_CONTENT)







