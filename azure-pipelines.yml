# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

pool:
  name: default
  demands:
    - Agent.OS -equals Linux

steps:
- script: |
    sudo chown root:root /etc/sudoers.d/90-cloud-init-users
    sudo chown root:root /etc/sudoers.d/README
    sudo chmod 440 /etc/sudoers.d/90-cloud-init-users
    sudo chmod 440 /etc/sudoers.d/README
  displayName: 'Fix sudoers file ownership and permissions'

- script: |
    sudo apt-get update
    sudo apt-get install python3.9
    sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.9 1
  displayName: 'Install Python 3.9'

- script: |
    python3 -m pip install --upgrade pip
    pip install -r app/requirements.txt
  displayName: 'Install dependencies'

- task: Docker@2
  inputs:
    containerRegistry: 'docker hub connection/3122022'
    repository: '3122022/azure-sample-app1'
    command: 'buildAndPush'
    Dockerfile: '**/Dockerfile'
    tags: 'latest'

- script: |
    mkdir -p ~/.kube
    echo "$(KUBECONFIG_CONTENT)" | base64 --decode > ~/.kube/config
  displayName: 'Set up kubeconfig'
  env:
    KUBECONFIG_CONTENT: $(KUBECONFIG_CONTENT)

- script: kubectl apply -f k8s/deployment.yaml
  displayName: 'Deploy to Kubernetes'
  env:
    KUBECONFIG_CONTENT: $(KUBECONFIG_CONTENT)






